# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.11/yaml.schema.json
version: v1.11
environmentFolderPath: ./env

# Production frontend is static on DreamHost. Keep all remote mutations explicit.
# Local development remains in m365agents.local.yml and the existing VS Code tasks.
provision:
  - uses: cli/runNpmCommand
    with:
      args: run toolkit:production-disabled

# This lifecycle only prepares files. It neither connects to DreamHost nor Azure.
deploy:
  - uses: cli/runNpmCommand
    name: Prepare DreamHost static files (no upload)
    with:
      args: run build:dreamhost

publish:
  - uses: cli/runNpmCommand
    with:
      args: run toolkit:production-disabled

# Preserve the Toolkit project identity.
projectId: d394d4cb-2010-4a84-b662-6d5806379557
